[project]
name = "edmc-bgs-influence-tracker"
version = "1.0.0"
description = "EDMC plugin: BGS influence estimation tracker"
requires-python = ">=3.10"
readme = "README.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "black>=24.0",
    "mypy>=1.11",
    "requests>=2.31",
    "types-requests>=2.31",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100
src = [".", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
]

[tool.ruff.lint.per-file-ignores]
# EDMC host module: imports/runtime only exist inside EDMC; defer style cleanups
"load.py" = ["E402", "E501", "F401", "F821", "I", "UP"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["EDMCOverlay.*", "edmcoverlay.*", "config", "myNotebook"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "load"
ignore_errors = true
